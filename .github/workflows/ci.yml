name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest -q
      - name: Smoke run of the full pipeline (5,000 sims, writes to a temp dir)
        run: captive run --quick --outdir "$RUNNER_TEMP/smoke" --no-readme
