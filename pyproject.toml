[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "captive-feasibility-model"
version = "1.0.0"
description = "Monte Carlo single-parent captive feasibility study for a hypothetical $50M US manufacturer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ali Askari"}]
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "pandas==3.0.6",
  "openpyxl==3.1.5",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
  "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.scripts]
captive = "captive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
